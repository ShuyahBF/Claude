# Déploiement Render (New > Blueprint > ce dépôt, fichier gemao/render.yaml).
# Les variables « sync: false » sont des SECRETS : Render les demande au premier déploiement (jamais dans ce fichier).
services:
  - type: web
    name: gemao-api
    runtime: python
    plan: starter
    autoDeploy: true
    rootDir: gemao/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL          # chaîne MongoDB Atlas mongodb+srv://… (SECRET)
        sync: false
      - key: ADMIN_EMAIL        # super-administrateur, créé au premier démarrage
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLE_MAITRE         # chiffre les clés HMAC des clients en base ; à CONSERVER : la perdre rend les clés illisibles
        generateValue: true
      - key: SAWALI_URL         # adresse de SAWALI
        sync: false
      - key: SAWALI_CHEMIN_ENVOI
        value: /api/webhook/gemao-message
      - key: MONGO_DB_NAME
        value: gemao
      - key: FRONTEND_ORIGIN
        sync: false
  - type: web
    name: gemao-site
    runtime: static
    rootDir: gemao/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL       # ex. https://gemao-api.onrender.com/api
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
