# Compile l'APK Android de "Raccourcis Paiement Mobile" (mobile-payments-app/android)
# sans avoir besoin d'Android Studio en local.
# Déclenchement (lot 13) :
#   - automatiquement à chaque push sur la branche par défaut qui modifie mobile-payments-app/** ;
#   - manuellement depuis l'onglet Actions (bouton "Run workflow"), avec une adresse d'API au choix.
# Par défaut, l'APK appelle l'API de PRODUCTION (API unique FastAPI partagée avec le site web).
#
# Le wrapper Gradle (gradlew) n'est pas versionné dans ce dépôt (généré par une
# sandbox sans accès réseau à l'origine) : on installe donc directement une
# version de Gradle compatible avec l'Android Gradle Plugin 8.7.3 utilisé par
# le projet (Gradle 8.9 minimum requis), plutôt que de committer un binaire.
#
# Lot 16 « Play Store » : Android 15 (API 35) et, en plus de l'APK de debug, un
# App Bundle de publication (bundleRelease, fichier .aab) à envoyer sur la Play Console.
# Signature lue dans les SECRETS GitHub (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64   : fichier de clés .jks converti en base64
#   ANDROID_KEYSTORE_PASSWORD : mot de passe du fichier de clés
#   ANDROID_KEY_ALIAS         : alias de la clé (ex. paiementmobile)
#   ANDROID_KEY_PASSWORD      : mot de passe de la clé
# Sans ces secrets, l'AAB est quand même produit, NON signé (annotation « notice »).
name: Build APK - Raccourcis Paiement Mobile

on:
  push:
    branches: [claude/python-gmail-pdf-script-3bnn5j]
    paths:
      - 'mobile-payments-app/**'
      - '.github/workflows/mobile-payments-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: >-
          URL de l'API (terminée par /). Par défaut : l'API de production
          https://paiement-mobile-api-jo11.onrender.com/ (émulateur + API locale : http://10.0.2.2:8000/).
        required: false
        default: 'https://paiement-mobile-api-jo11.onrender.com/'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-payments-app/android

    steps:
      - uses: actions/checkout@v5

      - name: Installer Java 17 (requis par Android Gradle Plugin 8.7)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Lot 15 : l'action android-actions/setup-android@v3 échoue désormais sur les machines GitHub
      # (Node 20 retiré). Les machines ubuntu-latest contiennent déjà le SDK Android (ANDROID_HOME) :
      # on accepte les licences et on installe seulement la plateforme et les build-tools utiles.
      # Lot 16 : plateforme Android 15 (API 35) et build-tools 35.0.0.
      - name: Préparer le SDK Android déjà présent sur la machine (licences, plateforme 35)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Petit script commun aux deux compilations : lance Gradle et, en cas d'échec, publie les
      # erreurs en « annotations » (lot 15) — visibles dans le résumé de l'exécution, sans ouvrir
      # le journal complet. Usage : ./lancer-gradle.sh <tâche> <fichier-journal>
      - name: Préparer le lanceur Gradle (erreurs publiées en annotations)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/lancer-gradle.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          TACHE="$1"; JOURNAL="$2"
          ARGS="$TACHE --stacktrace"
          # Adresse de l'API : celle saisie au lancement manuel, sinon celle de production (build.gradle.kts)
          if [ -n "$API_BASE_URL" ]; then
            ARGS="$ARGS -PapiBaseUrl=$API_BASE_URL"
          fi
          set -o pipefail
          if ! gradle $ARGS 2>&1 | tee "$JOURNAL"; then
            grep -E "^e: |error:|ERROR:|What went wrong|Could not|Unresolved reference|Missing class|R8:|FAILURE" "$JOURNAL" | head -25 | while IFS= read -r ligne; do
              echo "::error title=$TACHE::${ligne//%/%25}"
            done
            exit 1
          fi
          SCRIPT
          chmod +x "$RUNNER_TEMP/lancer-gradle.sh"

      - name: Compiler l'APK de debug (installable directement, non signé)
        shell: bash
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: '"$RUNNER_TEMP/lancer-gradle.sh" assembleDebug build-debug.log'

      - name: Publier l'APK comme fichier téléchargeable (onglet Actions -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-payments-debug-apk
          path: mobile-payments-app/android/app/build/outputs/apk/debug/app-debug.apk

      # Lot 16 : le fichier de clés n'est JAMAIS dans le dépôt. Il est reconstitué ici, à partir
      # du secret ANDROID_KEYSTORE_BASE64, dans un dossier temporaire de la machine (effacé en fin
      # de tâche). Son chemin est transmis à Gradle par la variable ANDROID_KEYSTORE_FILE.
      - name: Préparer la clé de signature (secrets GitHub)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            FICHIER="$RUNNER_TEMP/paiement-mobile.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$FICHIER"
            echo "ANDROID_KEYSTORE_FILE=$FICHIER" >> "$GITHUB_ENV"
            echo "::notice title=Signature::App Bundle signé avec la clé de publication (secrets GitHub)."
          else
            echo "::notice title=Signature::Secrets de signature absents (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) : l'App Bundle est produit NON signé. Voir mobile-payments-app/README.md, « Publication sur le Play Store »."
          fi

      - name: Compiler l'App Bundle de publication (bundleRelease, .aab)
        shell: bash
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
          # Mots de passe et alias passés à Gradle par variables d'environnement (jamais affichés)
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: '"$RUNNER_TEMP/lancer-gradle.sh" bundleRelease build-release.log'

      - name: Publier l'App Bundle (onglet Actions -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-payments-release-aab
          path: mobile-payments-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Toujours exécutée, même après un échec : le fichier de clés ne reste pas sur la machine
      - name: Effacer la clé de signature temporaire
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/paiement-mobile.jks"
