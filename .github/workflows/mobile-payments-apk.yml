# Compile l'APK Android de "Raccourcis Paiement Mobile" (mobile-payments-app/android)
# sans avoir besoin d'Android Studio en local. Déclenché à chaque push sur cette
# branche, ou manuellement depuis l'onglet Actions (bouton "Run workflow").
#
# Le wrapper Gradle (gradlew) n'est pas versionné dans ce dépôt (généré par une
# sandbox sans accès réseau à l'origine) : on installe donc directement une
# version de Gradle compatible avec l'Android Gradle Plugin 8.5.2 utilisé par
# le projet (Gradle 8.7 minimum requis), plutôt que de committer un binaire.
name: Build APK - Raccourcis Paiement Mobile

on:
  push:
    branches: [feat/mobile-payments-apk]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: >-
          URL de l'API backend en production (ex: https://mobile-payments-backend.onrender.com/).
          Laisser vide pour garder l'URL de dev (http://10.0.2.2:3000/, émulateur uniquement).
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-payments-app/android

    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 17 (requis par Android Gradle Plugin 8.5)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android (plateformes, build-tools, licences)
        uses: android-actions/setup-android@v3

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK de debug (installable directement, non signé)
        run: |
          if [ -n "${{ github.event.inputs.api_base_url }}" ]; then
            echo "Compilation avec API_BASE_URL=${{ github.event.inputs.api_base_url }}"
            gradle assembleDebug --stacktrace -PapiBaseUrl="${{ github.event.inputs.api_base_url }}"
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Publier l'APK comme fichier téléchargeable (onglet Actions -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-payments-debug-apk
          path: mobile-payments-app/android/app/build/outputs/apk/debug/app-debug.apk
