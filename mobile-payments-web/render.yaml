# Déploiement Render (New > Blueprint > ce dépôt, fichier mobile-payments-web/render.yaml).
# UN SEUL serveur pour le site ET l'application Android (lot 13) : l'API FastAPI
# ci-dessous. L'ancien serveur Node (mobile-payments-app/backend) n'est plus déployé.
#
# Les variables marquées « sync: false » sont des SECRETS : Render les demande au
# premier déploiement et les garde chiffrées (jamais de secret dans ce fichier).
services:
  # --------------------------------------------------------------------------
  # API FastAPI : site web + app Android (/api/android/…) + version + présence SAWALI
  # --------------------------------------------------------------------------
  - type: web
    name: paiement-mobile-api
    runtime: python
    plan: starter            # payant : le service ne s'endort jamais (l'app Android l'appelle à toute heure)
    autoDeploy: true
    rootDir: mobile-payments-web/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- SECRETS (à saisir par le propriétaire dans le tableau de bord Render) ---
      - key: MONGO_URL          # chaîne Atlas mongodb+srv://…
        sync: false
      - key: ADMIN_EMAIL        # compte administrateur (catalogue USSD), créé au démarrage
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LILUVINE_WA_HMAC   # clé HMAC de l'émetteur « paiementmobile » dans SAWALI (alerte WhatsApp)
        sync: false
      - key: JWT_SECRET         # généré par Render
        generateValue: true
      # --- Valeurs non secrètes ---
      - key: MONGO_DB_NAME
        value: paiement_mobile
      # Adresse du site (CORS, cookie Secure, lien des QR marchands, « url_site » des alertes).
      # Lot 91 : domaine auror.space. FRONTEND_ORIGIN accepte plusieurs adresses séparées par des virgules
      # (domaine, www, ancienne adresse Render gardée pour les liens et QR déjà diffusés).
      - key: FRONTEND_ORIGIN
        value: https://auror.space,https://www.auror.space,https://paiement-mobile-site.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://auror.space
      # Nom de l'émetteur déclaré dans SAWALI (en-tête X-Emetteur des alertes de connexion)
      - key: LILUVINE_WA_EMETTEUR
        value: paiementmobile
    # Domaine personnalisé (lot 91) : à ajouter dans Render → paiement-mobile-api → Settings → Custom Domains
    # (enregistrement CNAME « api » vers paiement-mobile-api-jo11.onrender.com chez le registrar)
    domains:
      - api.auror.space

  # --------------------------------------------------------------------------
  # Site statique React (gratuit)
  # --------------------------------------------------------------------------
  - type: web
    name: paiement-mobile-site
    runtime: static
    autoDeploy: true
    rootDir: mobile-payments-web/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse de l'API + /api (lue à la compilation du site)
      # Lot 91 : serveur sur api.auror.space (même domaine que le site : les cookies de session passent sur Safari)
      - key: VITE_API_BASE_URL
        value: https://api.auror.space/api
    routes:
      # Application React (React Router) : toute adresse retombe sur index.html
      - type: rewrite
        source: /*
        destination: /index.html
    # Domaines personnalisés (lot 91) : auror.space (enregistrement A) et www.auror.space (CNAME, redirige vers auror.space)
    domains:
      - auror.space
      - www.auror.space
